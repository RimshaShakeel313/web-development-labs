
<!DOCTYPE html>
<html>

<head>
    <title>My Calculator</title>

    <link rel="stylesheet" href="calculator.css">
</head>

<body class="green">

    <div class="header">
        <h1>MY CALCULATOR</h1>
        <p>A Simple and Easy Calculator</p>
    </div>

    <div class="theme-options">

        <h3>Choose Your Theme</h3>

        <button class="green-button" data-theme="green">
            Green
        </button>

        <button class="blue-button" data-theme="blue">
            Blue
        </button>

        <button class="purple-button" data-theme="purple">
            Purple
        </button>

    </div>

    <div class="calculator">

        <div class="display">
            <input type="text" id="result" value="0" readonly>
        </div>

        <div class="buttons">

            <button class="clear" data-value="C">C</button>
            <button class="delete" data-value="DEL">DEL</button>
            <button class="operator" data-value="%">%</button>
            <button class="operator" data-value="/">÷</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="operator" data-value="*">×</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="operator" data-value="-">−</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button class="operator" data-value="+">+</button>

            <button data-value="0">0</button>
            <button data-value=".">.</button>
            <button class="equal" data-value="=">=</button>

        </div>

    </div>

    <div class="footer">
        <h3>Thank You for Using Our Calculator!</h3>
        <p>Made with love &#9829;</p>
    </div>

    <script src="calculator.js"></script>

</body>
</html>
