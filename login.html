
<!DOCTYPE html>
<html>

<head>
    <title>My Website - Login</title>
    <link rel="stylesheet" href="green.css">
</head>

<body>

    <div class="header">
        <h1>MY WEBSITE</h1>
        <h3>Welcome to Our Website</h3>
        <p>A place to begin your journey</p>
    </div>

    <div class="theme-options">
        <b>Choose Theme:</b>

        <label>
            <input type="radio" name="theme" id="green"
                   value="green" checked>
            Green
        </label>

        <label>
            <input type="radio" name="theme" id="blue"
                   value="blue">
            Blue
        </label>
    </div>

    <div class="main-heading">
        <h1>Welcome Back!</h1>
        <p>Please enter your details to log in.</p>
    </div>

    <div class="form-box">

        <h2>Login</h2>

        <form action="welcome.html">

            <b>Username</b>
            <br><br>

            <input type="text" name="username" required>

            <br><br>

            <b>Password</b>
            <br><br>

            <input type="password" name="password" required>

            <br><br>

            <div class="button-area">
                <input type="submit" value="Login">
            </div>

        </form>

        <div class="button-area">
            <p>Don't have an account?</p>

            <a href="registeration.html">Create a New Account</a>
        </div>

    </div>

    <div class="footer">
        <h3>Thank You for Visiting!</h3>
        <p>Made with love &#9829;</p>
    </div>

</body>
</html>
