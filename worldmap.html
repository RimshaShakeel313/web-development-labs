
<!DOCTYPE html>
<html>
<head>
    <title>World Explorer</title>
</head>

<body bgcolor="#EAF4F4">

    <h1 align="center">WORLD EXPLORER</h1>

    <h3 align="center">Explore the Seven Continents of the World</h3>

    <hr>

    <p align="center">
        Welcome to World Explorer! Click on any continent
        on the world map to explore it.
    </p>

    <center>
        <img src="world map.jpg"
             alt="Interactive World Map"
             width="900"
             height="500"
             usemap="#worldmap">
    </center>

    <map name="worldmap">

        <!-- North America -->
        <area shape="rect"
              coords="100,70,370,280"
              href="north-america.html"
              alt="North America">

        <!-- South America -->
        <area shape="rect"
              coords="300,250,470,440"
              href="south-america.html"
              alt="South America">

        <!-- Europe -->
        <area shape="rect"
              coords="400,50,570,200"
              href="europe.html"
              alt="Europe">

        <!-- Africa -->
        <area shape="rect"
              coords="400,180,600,390"
              href="africa.html"
              alt="Africa">

        <!-- Asia -->
        <area shape="rect"
              coords="550,50,850,300"
              href="asia.html"
              alt="Asia">

        <!-- Oceania -->
        <area shape="rect"
              coords="680,270,870,410"
              href="oceania.html"
              alt="Oceania">

        <!-- Antarctica -->
        <area shape="rect"
              coords="200,420,850,490"
              href="antarctica.html"
              alt="Antarctica">

    </map>

    <hr>

    <h3 align="center">Explore the World!</h3>

    <p align="center">
        Discover different continents, countries and cities.
    </p>

    <p align="center">
        Made by: Rimsha Shakeel
    </p>

</body>
</html>
